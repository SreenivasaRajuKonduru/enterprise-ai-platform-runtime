services:
  api-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-platform-api-1
    environment:
      SERVICE_NAME: api-1
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  api-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-platform-api-2
    environment:
      SERVICE_NAME: api-2
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: ai-platform-worker
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: ai-platform-postgres
    environment:
      POSTGRES_USER: ai_platform
      POSTGRES_PASSWORD: ai_platform_password
      POSTGRES_DB: ai_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai-platform-redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    container_name: ai-platform-nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-platform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api-1
      - api-2

volumes:
  postgres_data:
